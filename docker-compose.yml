name: cookshare
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cookshare}
      MYSQL_USER: ${DB_USER:-cookshare}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-cookshare_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: [no-new-privileges:true]
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cookshare}
      DB_USER: ${DB_MIGRATION_USER:-cookshare_migrator}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}
    command: [node, dist/config/migrate.js]
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    security_opt: [no-new-privileges:true]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: '1'
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cookshare}
      DB_USER: ${DB_USER:-cookshare}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database,web,monitoring]
    volumes:
      - uploads:/app/backend/uploads
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['8080:8080']
    volumes: ['./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      api:
        condition: service_healthy
    networks: [web]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  seed:
    profiles: [seed]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cookshare}
      DB_USER: ${DB_USER:-cookshare}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD}
    command: [node, dist/config/seed.js]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: [tools]
    ports: ['127.0.0.1:8081:80']
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
volumes:
  mysql_data:
  uploads:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
networks:
  database:
    internal: true
  web:
  monitoring:
    internal: true
  docker_observer:
    internal: true
