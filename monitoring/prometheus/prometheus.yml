global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: cookshare-api
    static_configs:
      - targets: ['api:3000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: mysql
    static_configs:
      - targets: ['mysql-exporter:9104']
  - job_name: containers
    static_configs:
      - targets: ['cadvisor:8080']
