services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d]
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  grafana:
    image: grafana/grafana:13.2.4
    ports: ['127.0.0.1:3001:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    depends_on: [prometheus,loki]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  loki:
    image: grafana/loki:3.7.8
    command: [-config.file=/etc/loki/loki.yml]
    ports: ['127.0.0.1:3100:3100']
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [monitoring]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: '1'
      INFO: '1'
      POST: '0'
    volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro']
    networks: [docker_observer]
    security_opt: [no-new-privileges:true]
  alloy:
    image: grafana/alloy:v1.20.1
    user: '473:473'
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on: [docker-socket-proxy,loki]
    networks: [monitoring,docker_observer]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    command: [--mysqld.address=db:3306, --mysqld.username=exporter, --collect.global_status, --collect.global_variables]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [database,monitoring]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    command: [--docker_only=true, --housekeeping_interval=30s]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
